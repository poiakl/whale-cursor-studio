name: Windows desktop build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check --select F .
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check native Windows compositor at multiple scales
        shell: pwsh
        run: |
          foreach ($scale in @("1", "1.25", "1.5", "2")) {
            $env:QT_SCALE_FACTOR = $scale
            python tests/desktop_render_probe.py
            if ($LASTEXITCODE -ne 0) { throw "Compositor probe failed at scale $scale" }
          }
        env:
          QT_QPA_PLATFORM: windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-render-diagnostics
          path: render-diagnostics
          if-no-files-found: ignore
          retention-days: 30
      - name: Package portable Windows app
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name WhaleCursorStudio --add-data "assets;assets" --collect-all PySide6.QtMultimedia main.py
      - name: Package local MCP companion
        run: python -m PyInstaller --noconfirm --clean --console --onefile --name WhaleCursorMCP --copy-metadata mcp --collect-submodules mcp.server.fastmcp mcp_entry.py
      - name: Include MCP companion
        shell: pwsh
        run: Copy-Item dist/WhaleCursorMCP.exe dist/WhaleCursorStudio/WhaleCursorMCP.exe
      - name: Launch packaged app and check all pages
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $portableRoot = Join-Path $env:RUNNER_TEMP "便携程序 测试"
          Copy-Item "dist/WhaleCursorStudio" $portableRoot -Recurse
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "全新用户 数据"
          $exePath = Join-Path $portableRoot "WhaleCursorStudio.exe"
          # The executable must not depend on its working directory or a Python install.
          $process = Start-Process -FilePath $exePath -WorkingDirectory $env:WINDIR -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "Packaged app did not complete its launch check" }
          if ($process.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA/WhaleCursorStudio2/error.log" -ErrorAction SilentlyContinue
            throw "Packaged app launch failed: $($process.ExitCode)"
          }
      - name: Check packaged MCP protocol
        shell: pwsh
        run: |
          $portableRoot = Join-Path $env:RUNNER_TEMP "便携程序 测试"
          python tests/mcp_protocol_probe.py --server "$portableRoot/WhaleCursorMCP.exe" --editor "$portableRoot/WhaleCursorStudio.exe" --workspace "$env:RUNNER_TEMP/AI 工作目录"
          if ($LASTEXITCODE -ne 0) { throw "Packaged MCP protocol check failed" }
      - name: Archive portable app
        shell: pwsh
        run: |
          Copy-Item README.md dist/WhaleCursorStudio/使用说明.md
          Copy-Item docs/mcp.md dist/WhaleCursorStudio/AI接入说明.md
          python -c "from whale_cursor.project import Project; Project.defaults().save('dist/WhaleCursorStudio/Schemes/Whale-Maid.whalepack')"
          if ($LASTEXITCODE -ne 0) { throw "Could not include bundled cursor scheme" }
          Compress-Archive -Path dist/WhaleCursorStudio -DestinationPath WhaleCursorStudio-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WhaleCursorStudio-Windows
          path: WhaleCursorStudio-Windows.zip
          retention-days: 30
      - name: Publish rolling portable release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-latest --title "Windows 便携版" --notes "解压后运行 WhaleCursorStudio.exe。后续主分支构建会更新此附件。"
          }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/desktop-latest" -f "sha=$env:GITHUB_SHA" -F force=true
          if ($LASTEXITCODE -ne 0) { throw "Could not update rolling release source tag" }
          gh release edit desktop-latest --title "Windows 便携版 · 3.4" --notes "MCP 直接连接工坊当前界面：读取提示词与参考图、回填生成结果、编写及预览点击关键帧、配置互动音效。音效新增播完再播和触发间隔，实时生效并随方案保存。完整解压后运行 WhaleCursorStudio.exe；设置中复制新版 MCP 配置。"
          gh release upload desktop-latest WhaleCursorStudio-Windows.zip --clobber
